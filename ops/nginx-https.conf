server {
    listen 80;
    listen [::]:80;
    server_name demosha2026.storkyproduct.ru;
    root /srv/demosha2026/current;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/demosha2026/acme;
        try_files $uri =404;
    }
    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files /deployment.json =503;
    }
    location / { return 301 https://demosha2026.storkyproduct.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demosha2026.storkyproduct.ru;
    root /srv/demosha2026/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/demosha2026.storkyproduct.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demosha2026.storkyproduct.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/demosha2026.access.log;
    error_log /var/log/nginx/demosha2026.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files /deployment.json =503;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location /media/ { try_files $uri =404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
