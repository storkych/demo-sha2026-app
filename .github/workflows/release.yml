name: Desktop releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v1.0.7)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  NO_UPDATE_NOTIFIER: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    name: Build and test ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            command: pack
          - platform: macos
            runner: macos-latest
            command: pack:mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Check tag matches package version
        shell: bash
        run: node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) throw new Error("The release tag must match package.json version.")'
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.command }}
      - name: Test the packaged desktop application
        env:
          TEST_PACKAGED: '1'
        run: npm run test:desktop
      - name: Test the portable executable in another directory
        if: matrix.platform == 'windows'
        run: node tests/portable.mjs
      - name: Test universal Mac archives and read-only DMG startup
        if: matrix.platform == 'macos'
        run: node tests/macos.mjs
      - name: Upload Windows executable
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows
          path: release/FlightArchive-Portable-*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload Mac installers
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos
          path: |
            release/FlightArchive-macOS-*-universal.dmg
            release/FlightArchive-macOS-*-universal.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Windows and macOS together
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Verify release files and write checksums
        run: node scripts/release-files.cjs
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json tagName > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.exe release/*.dmg release/*.zip release/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" release/*.exe release/*.dmg release/*.zip release/SHA256SUMS.txt --verify-tag --title "Архив рейсов $RELEASE_TAG" --notes-file scripts/RELEASE_NOTES.md
          fi
